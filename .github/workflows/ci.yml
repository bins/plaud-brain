name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: plaud_brain_test
          POSTGRES_USER: plaud
          POSTGRES_PASSWORD: plaud
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plaud -d plaud_brain_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://plaud:plaud@127.0.0.1:5432/plaud_brain_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m compileall src
      - run: pytest -q
      - run: bash -n scripts/*.sh
