services:
  postgres:
    image: postgres:16-alpine
    container_name: plaud_brain_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: plaud_brain
      POSTGRES_USER: plaud
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}"
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - plaud_brain_postgres_data:/var/lib/postgresql/data
      - ./infra/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plaud -d plaud_brain"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  plaud_brain_postgres_data:
